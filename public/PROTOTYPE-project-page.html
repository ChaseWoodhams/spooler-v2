<!DOCTYPE html>
<!-- PROTOTYPE (throwaway): "Project page and plate status layout", wayfinder ticket 04.
     Three variants for a BIG project (SEAT: 26 plates, 2 printers), switchable with ?variant=A|B|C or arrow keys.
     Stub data, in memory only, no backend. Open this file directly. Delete after the decision is captured. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PROTOTYPE – project page</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { margin: 0; background: var(--bg, #0d0e12); color: var(--text, #e8e8ec); font-family: system-ui, sans-serif; padding-bottom: 70px; }
  .muted { color: var(--text-muted, #8a8d98); font-size: 12px; }
  .card { background: var(--surface, #16171d); border: 1px solid var(--border, #2a2c35); border-radius: 10px; padding: 12px; }
  .top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border, #2a2c35); flex-wrap: wrap; }
  .wrap { padding: 14px 16px; }
  .bar { height: 10px; border-radius: 6px; background: #22242c; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .st-unsliced { --c: #6b6f7b; } .st-sliced { --c: #5aa9ff; } .st-queued { --c: #facc15; } .st-printing { --c: #ff6b2b; }
  .st-ok { --c: #4ade80; } .st-failed { --c: #f87171; } .st-held { --c: #b48cff; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--c); color: var(--c); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; }
  .btn2 { background: var(--accent, #ff6b2b); color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn2.sec { background: transparent; border: 1px solid var(--border, #2a2c35); color: inherit; font-weight: 400; }
  .printers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .pr { border-left: 4px solid var(--c); }
  .layout { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(260px,1fr); gap: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; } td, th { padding: 6px 8px; border-bottom: 1px solid var(--border, #2a2c35); text-align: left; }
  tr.sel { background: rgba(255,107,43,.08); } tr { cursor: pointer; }
  .cols { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 10px; overflow-x: auto; }
  .col h4 { margin: 0 0 6px; font-size: 12px; color: var(--text-muted, #8a8d98); }
  .tile { background: var(--surface, #16171d); border: 1px solid var(--border, #2a2c35); border-left: 4px solid var(--c); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; font-size: 12px; cursor: pointer; }
  .tile.sel { outline: 2px solid var(--accent, #ff6b2b); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
  .cell { aspect-ratio: 1; border-radius: 8px; border: 2px solid var(--c); display: grid; place-items: center; font-size: 12px; cursor: pointer; background: rgba(255,255,255,.02); }
  .cell.sel { background: var(--c); color: #000; }
  .stepper { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; } .stepper span { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border, #2a2c35); color: var(--text-muted, #8a8d98); }
  .stepper .on { color: var(--text, #e8e8ec); border-color: var(--accent, #ff6b2b); background: rgba(255,107,43,.12); }
  #proto-bar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; background: #fff; color: #111;
    padding: 8px 14px; border-radius: 999px; box-shadow: 0 4px 20px rgba(0,0,0,.5); font: 600 13px system-ui; z-index: 99; }
  #proto-bar button { border: 0; background: #eee; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; }
  select { background: var(--surface2, #1e2028); color: inherit; border: 1px solid var(--border, #2a2c35); border-radius: 8px; padding: 4px 6px; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="proto-bar"></div>
<script>
const STATUS = { unsliced: "Not sliced", sliced: "Sliced", held: "Waiting on plate", queued: "Queued", printing: "Printing", ok: "Printed OK", failed: "Failed" };
// 26 stub plates: statuses spread to show a project mid-way through
const plan = ["ok","ok","ok","ok","ok","ok","ok","ok","ok","ok","ok","ok","failed","printing","printing","queued","queued","held","held","sliced","sliced","sliced","unsliced","unsliced","unsliced","unsliced"];
const plates = plan.map((s, i) => ({ n: i + 1, name: "Plate " + (i + 1), parts: 1 + (i % 3), est: (2 + (i * 37) % 7) + " h " + ((i * 13) % 60) + " min",
  status: s, printer: s === "printing" ? (i === 13 ? "Dunt" : "OG") : (i % 2 ? "OG" : "Dunt"), after: s === "held" ? "Plate " + (i - 3) : null,
  fail: s === "failed" ? "adhesion" : null, supports: i % 5 === 0 }));
const printers = [{ name: "Dunt", state: "waiting", note: "Plate 14 finished 6 min ago: confirm outcome and Bed cleared to start Plate 16" },
                  { name: "OG", state: "printing", note: "Plate 15 · 41% · 2 h 10 min left" }];
const ORDER = ["failed", "printing", "queued", "held", "sliced", "unsliced", "ok"];
const q = new URLSearchParams(location.search);
const VARIANTS = { A: "List + detail pane", B: "Board by status", C: "Plate map + next-up panel" };
let variant = (q.get("variant") || "A").toUpperCase(); let sel = 13;
const chip = s => `<span class="chip st-${s}"><i class="dot st-${s}"></i>${STATUS[s]}</span>`;
const counts = () => plates.reduce((a, p) => (a[p.status] = (a[p.status] || 0) + 1, a), {});

function header() {
  const c = counts(), done = c.ok || 0;
  return `<div class="top"><b>Spooler</b><span class="muted">/ SEAT</span><span style="flex:1"></span>
    <div class="stepper"><span>Model ✓</span><span>Split ✓</span><span>Plates ✓</span><span>Slice (4 left)</span><span class="on">Print</span></div></div>
  <div class="wrap"><div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><b>${done} of ${plates.length} plates printed</b>
    <span class="muted">${c.failed || 0} failed · ${c.printing || 0} printing · ${(c.queued || 0) + (c.held || 0)} waiting · ${(c.sliced || 0) + (c.unsliced || 0)} to slice</span></div>
    <div class="bar">${ORDER.slice().reverse().map(s => `<i class="st-${s}" style="width:${(c[s] || 0) / plates.length * 100}%;background:var(--c)"></i>`).join("")}</div></div>
    <div class="printers">${printers.map(p => `<div class="card pr st-${p.state === "waiting" ? "queued" : "printing"}"><b>${p.name}</b>
      <span class="chip st-${p.state === "waiting" ? "queued" : "printing"}" style="margin-left:6px">${p.state === "waiting" ? "Needs you" : "Printing"}</span>
      <div class="muted" style="margin:4px 0">${p.note}</div>
      ${p.state === "waiting" ? `<button class="btn2" data-act="cleared">Printed OK · Bed cleared</button> <button class="btn2 sec" data-act="failedtap">Failed…</button>` : ""}</div>`).join("")}</div>`;
}
function detail() {
  const p = plates[sel - 1];
  return `<div class="card"><b>${p.name}</b> ${chip(p.status)}<div class="muted" style="margin:4px 0">${p.parts} part(s) · ${p.est}${p.supports ? " · supports" : ""}</div>
    ${p.after ? `<div class="muted">Holds until ${p.after} prints OK</div>` : ""}${p.fail ? `<div class="muted">Failed: ${p.fail}</div>` : ""}
    <div style="margin:8px 0">Print on <select><option>${p.printer}</option><option>Dunt</option><option>OG</option><option>Next free</option></select></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${p.status === "unsliced" ? `<button class="btn2" data-act="slice">Slice</button>` : ""}
      ${p.status === "sliced" ? `<button class="btn2" data-act="queue">Add to queue</button>` : ""}
      ${p.status === "failed" ? `<button class="btn2" data-act="reprint">Reprint</button>` : ""}
      ${p.status === "queued" ? `<button class="btn2 sec">Hold after…</button>` : ""}<button class="btn2 sec">Open in Plates</button></div></div>`;
}
function A() {
  return header() + `<div class="layout"><div class="card" style="max-height:480px;overflow:auto"><table><tr><th>#</th><th>Status</th><th>Printer</th><th>Est.</th></tr>
    ${plates.slice().sort((a, b) => ORDER.indexOf(a.status) - ORDER.indexOf(b.status) || a.n - b.n).map(p => `<tr data-p="${p.n}" class="${p.n === sel ? "sel" : ""}"><td>${p.n}</td><td>${chip(p.status)}</td><td>${p.printer}</td><td>${p.est}</td></tr>`).join("")}</table></div>${detail()}</div></div>`;
}
function B() {
  const cols = [["To slice", ["unsliced", "sliced"]], ["Waiting", ["held", "queued"]], ["Printing", ["printing"]], ["Failed", ["failed"]], ["Done", ["ok"]]];
  return header() + `<div class="cols">${cols.map(([t, ss]) => { const ps = plates.filter(p => ss.includes(p.status)); return `<div class="col"><h4>${t} (${ps.length})</h4>
    ${ps.slice(0, 8).map(p => `<div class="tile st-${p.status} ${p.n === sel ? "sel" : ""}" data-p="${p.n}"><b>${p.name}</b> <span class="muted">${p.printer}</span><br>${chip(p.status)}</div>`).join("")}${ps.length > 8 ? `<div class="muted">+${ps.length - 8} more</div>` : ""}</div>`; }).join("")}</div>
    <div style="margin-top:12px;max-width:420px">${detail()}</div></div>`;
}
function C() {
  const next = plates.filter(p => ["queued", "held", "sliced"].includes(p.status)).slice(0, 3);
  return header() + `<div class="layout"><div class="card"><div class="muted" style="margin-bottom:8px">Every plate at a glance. Colour = status, click for detail.</div>
    <div class="grid">${plates.map(p => `<div class="cell st-${p.status} ${p.n === sel ? "sel" : ""}" data-p="${p.n}" title="${p.name}: ${STATUS[p.status]}">${p.n}</div>`).join("")}</div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${Object.keys(STATUS).map(chip).join("")}</div></div>
    <div style="display:grid;gap:12px"><div class="card"><b>Next up</b>${next.map(p => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border,#2a2c35)"><span>${p.name} → ${p.printer}</span>${chip(p.status)}</div>`).join("")}
      <button class="btn2" style="margin-top:8px" data-act="assign">Assign printers · balance by time</button></div>${detail()}</div></div></div>`;
}
function render() {
  history.replaceState(null, "", "?variant=" + variant);
  document.getElementById("app").innerHTML = { A, B, C }[variant]();
  document.getElementById("proto-bar").innerHTML = `<button data-v="-1">‹</button><span>${variant} (${VARIANTS[variant]})</span><button data-v="1">›</button>`;
}
document.addEventListener("click", e => {
  const v = e.target.closest("[data-v]"), p = e.target.closest("[data-p]"), a = e.target.closest("[data-act]");
  if (v) { const k = Object.keys(VARIANTS); variant = k[(k.indexOf(variant) + +v.dataset.v + 3) % 3]; }
  if (p) sel = +p.dataset.p;
  if (a) { const pl = plates[sel - 1], t = a.dataset.act;
    if (t === "reprint") pl.status = "queued"; if (t === "slice") pl.status = "sliced"; if (t === "queue") pl.status = "queued";
    if (t === "cleared") { plates[13].status = "ok"; plates[15].status = "printing"; printers[0] = { name: "Dunt", state: "printing", note: "Plate 16 started · 0%" }; }
    if (t === "failedtap") { plates[13].status = "failed"; plates[13].fail = "adhesion"; } }
  render();
});
document.addEventListener("keydown", e => { if (/SELECT/.test(document.activeElement.tagName)) return; const k = Object.keys(VARIANTS);
  if (e.key === "ArrowRight") variant = k[(k.indexOf(variant) + 1) % 3]; else if (e.key === "ArrowLeft") variant = k[(k.indexOf(variant) + 2) % 3]; else return; render(); });
render();
</script>
</body>
</html>
