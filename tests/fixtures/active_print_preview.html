<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Active print control preview</title>
  <link rel="stylesheet" href="../../public/style.css" />
</head>
<body>
  <main style="width: 100%; max-width: 720px; margin: 0 auto; padding: 16px;">
    <section class="detail-panel detail-files-panel">
      <div class="detail-panel-heading">
        <div><span class="detail-eyebrow">Jobs</span><h2>Printer files</h2></div>
        <button class="btn btn-primary">Browse &amp; start print</button>
      </div>
      <p class="detail-help">Select a file already on this printer, review its print options, and start it from the existing protected workflow.</p>
      <div class="detail-active-job">
        <div class="detail-active-job-heading">
          <div><span class="detail-job-label">Current print</span><strong title="Woodlawn_robotics_fixture_v12.gcode">Woodlawn_robotics_fixture_v12.gcode</strong></div>
          <span class="detail-job-state printing">Printing</span>
        </div>
        <div class="detail-job-progress" role="progressbar" aria-label="Print progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64"><span style="width: 64%"></span></div>
        <div class="detail-job-meta"><span>64% complete</span><span>1h 18m remaining</span></div>
      </div>
      <div class="detail-job-actions">
        <button class="btn btn-secondary detail-job-primary">Pause print</button>
        <button class="btn btn-danger detail-job-stop">Stop print</button>
      </div>
    </section>
  </main>
</body>
</html>
